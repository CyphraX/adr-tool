packages:
  - packages/*

# pnpm 11 runs a dependency's install scripts only when it is listed here.
allowBuilds:
  electron: true
  esbuild: true
  # Only the grammars' prebuilt .wasm is used. Their install scripts would build the
  # native Node bindings with node-gyp, which nothing here loads.
  tree-sitter-go: false
  tree-sitter-java: false
  tree-sitter-python: false
  # electron-builder brings it for Squirrel.Windows, which the release does not build (NSIS
  # and a portable exe instead; docs/release.md).
  electron-winstaller: false
