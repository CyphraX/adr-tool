<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="672" viewBox="16 20 1208 672" role="img">
  <title>The packages of Softarch Suite</title>
  <desc>Each package of this repository, which of them uses which, and what lies outside of it. The code stands behind every connection between two packages. core uses kernel. structure uses kernel. conformance uses kernel. conformance uses structure: Components, Dependencies. diagrams uses kernel. diagrams uses structure: Components, Dependencies. review uses kernel. review uses structure: Source Files. mcp uses core: serves ADRs. mcp uses structure. mcp uses cli: runs git, reads code. mcp uses diagrams: plans Diagrams. mcp uses kernel: the settings. cli uses core: lints and exports. cli uses structure. cli uses conformance: checks the Rules. cli uses diagrams: checks the Diagrams. cli uses kernel: the git port. app uses core: Decisions. app uses structure: Structure. app uses conformance: renames in the Rules. app uses cli: the export. app uses diagrams: Diagrams. app uses kernel: the settings. app uses review: German sentences. app uses git: history and commits. A coding agent uses mcp: plans changes.</desc>
