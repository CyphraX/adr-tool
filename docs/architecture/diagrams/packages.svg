<svg xmlns="http://www.w3.org/2000/svg" width="988" height="612" viewBox="16 -40 988 612" role="img">
  <title>The packages of Softarch Suite</title>
  <desc>Each package of this repository, which of them uses which, and what lies outside of it. The code stands behind every connection between two packages. core uses kernel. structure uses kernel. diagrams uses kernel. diagrams uses structure: Components, Dependencies. mcp uses core: serves ADRs. mcp uses structure. cli uses core: lints and exports. cli uses structure. app uses core: Decisions. app uses structure: Structure. app uses cli: the export. app uses diagrams: German sentences. app uses git: history and commits. A coding agent uses mcp: plans changes.</desc>
  <style>
    svg { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .background, .ground { fill: #eef1f5; }
    .box { fill: #fcfcfd; stroke: #8891a3; stroke-width: 1.2; }
    .external .box { stroke-dasharray: 6 4; }
    .repository .box { stroke-width: 2; }
    .name { fill: #1c2230; font-size: 14px; font-weight: 600; }
    .title { fill: #1c2230; font-size: 16px; font-weight: 600; }
    .description, .label, .legend { fill: #566075; font-size: 12px; }
    .line { fill: none; stroke: #566075; stroke-width: 1.4; }
    .arrowhead { fill: #566075; }
    @media (prefers-color-scheme: dark) {
      .background, .ground { fill: #1f222a; }
      .box { fill: #181a20; stroke: #737d91; }
      .name, .title { fill: #e4e7ee; }
      .description, .label, .legend { fill: #a5aec0; }
      .line { stroke: #a5aec0; }
      .arrowhead { fill: #a5aec0; }
    }
  </style>
