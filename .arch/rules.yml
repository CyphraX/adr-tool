# The Rules of Softarch Suite's own repository (docs/conformance-format.md), checked by
# `adr check` in CI (.github/workflows/ci.yml).
rules:
  - id: kernel-depends-on-nothing
    why: The kernel is what every module stands on, so it can lean on none of them (ADR-0006).
    kind: may-only-depend
    from: kernel
    to: []

  - id: core-and-structure-apart
    why: Decisions and Structure each speak their own glossary; where they meet, their caller joins them (ADR-0006).
    kind: must-not-depend
    from: [core, structure]
    to: [core, structure]

  - id: conformance-on-structure
    why: Conformance evaluates its Rules on Structure's model and is told about Decisions by its caller (ADR-0006).
    kind: may-only-depend
    from: conformance
    to: [kernel, structure]

  - id: diagrams-on-structure
    why: Diagrams binds its elements to Structure's Components and measures Drift against its Dependencies, and leans on no other module (ADR-0006, ADR-0018).
    kind: may-only-depend
    from: diagrams
    to: [kernel, structure]

  - id: layered
    why: The window uses the command line and the servers, which use the module cores, which use the kernel.
    kind: layers
    layers: [app, [cli, mcp], [conformance, diagrams], [core, structure], kernel]

  - id: no-cycles-between-packages
    why: A package in a Cycle can be neither understood nor tested on its own.
    kind: no-cycles
    among: '*'
