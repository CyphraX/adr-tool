# The Rules of Softarch Suite's own repository (docs/conformance-format.md), checked by
# `adr check` in CI (.github/workflows/ci.yml).
rules:
  - id: kernel-depends-on-nothing
    why: The kernel is what every module stands on, so it can lean on none of them (ADR-0006).
    kind: may-only-depend
    from: kernel
    to: []

  - id: core-and-structure-apart
    why: Decisions and Structure each speak their own glossary; where they meet, their caller joins them (ADR-0006).
    kind: must-not-depend
    from: [core, structure]
    to: [core, structure]

  - id: conformance-on-structure
    why: Conformance evaluates its Rules on Structure's model and is told about Decisions by its caller (ADR-0006).
    kind: may-only-depend
    from: conformance
    to: [kernel, structure]

  - id: diagrams-on-structure
    why: Diagrams binds its elements to Structure's Components and measures Drift against its Dependencies, and leans on no other module (ADR-0006, ADR-0018).
    kind: may-only-depend
    from: diagrams
    to: [kernel, structure]

  - id: review-on-structure
    why: Review anchors its Annotations in Structure's Source Files and is told about Decisions by its caller, and leans on no other module (ADR-0006, ADR-0019).
    kind: may-only-depend
    from: review
    to: [kernel, structure]

  - id: assessment-on-structure
    why: Assessment freezes Structure's metrics in its Snapshots and is told about Decisions, Rules and Annotations by its caller, and leans on no other module (ADR-0006, ADR-0021).
    kind: may-only-depend
    from: assessment
    to: [kernel, structure]

  - id: git-port-stands-alone
    why: The kernel's git port is types and a history in memory; git itself is run in the command line's one module (ADR-0020).
    kind: may-only-depend
    from: kernel/git
    to: []

  - id: only-the-window-uses-electron
    why: Only the window runs in Electron; the cores, the command line and the MCP server run in Node.js alone, wherever they are copied to.
    kind: library
    library: electron
    only-in: app

  - id: layered
    why: The window uses the command line and the servers, which use the module cores, which use the kernel.
    kind: layers
    layers:
      [app, [cli, mcp], [conformance, diagrams, review, assessment], [core, structure], kernel]

  - id: no-cycles-between-packages
    why: A package in a Cycle can be neither understood nor tested on its own.
    kind: no-cycles
    among: '*'
